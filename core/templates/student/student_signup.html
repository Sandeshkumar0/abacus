<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMESYS – Student Sign Up</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter Font (optional for design match) -->
  <link href="https://fonts.bunny.net/css?family=inter:400,600,700" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen flex flex-col lg:flex-row">

  <!-- Left Panel -->
  <div class="flex-1 bg-white flex flex-col items-center justify-center p-4 sm:p-8 relative lg:min-h-screen">
    <!-- Logo -->
    <header class="p-6 lg:p-8">
      <div class="flex items-center gap-3">
        <img src="{% static 'portal/Logo.png' %}" alt="EMESYS Logo" class="absolute left-8 top-8 h-24">


      </div>
    </header>

    <!-- Illustration -->
    <div class="max-w-md w-full flex justify-center mt-8 lg:mt-0">
      <img
        src="https://cdn.builder.io/api/v1/assets/dffd9b5ec8a242b7b1d9a6b017d2f423/4061368-6b55a6?format=webp&width=800"
        alt="Students with backpacks" class="w-full h-auto max-w-xs sm:max-w-sm" />
    </div>
  </div>

  <!-- Right Panel -->
  <div class="w-full lg:w-1/2 relative bg-cover bg-center bg-no-repeat flex items-center justify-center p-6 lg:p-8"
    style="background-image: url('{% static 'portal/5883.jpg' %}')">

    <div class="relative z-10 bg-white/90 backdrop-blur-sm rounded-2xl p-6 sm:p-8 w-full max-w-md shadow-xl">
      <div class="text-center mb-6 sm:mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-blue-600 mb-2">Student Sign Up</h1>
        <p class="text-sm sm:text-base text-gray-600">Hey Enter Your Details To Create Account</p>
      </div>

      <form action="{% url 'student_signup' %}" method="POST" class="space-y-4 sm:space-y-5">
        {% csrf_token %}

        <!-- Django Messages -->
        {% if messages %}
        <div class="space-y-2 mb-4">
          {% for message in messages %}
          <div
            class="p-4 rounded-xl {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-300{% elif message.tags == 'success' %}bg-green-100 text-green-700 border border-green-300{% else %}bg-blue-100 text-blue-700 border border-blue-300{% endif %}">
            {{ message }}
          </div>
          {% endfor %}
        </div>
        {% endif %}

        <!-- Name -->
        <div class="relative">
          <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
          <input type="text" placeholder="Enter Your Name" name="name"
            class="pl-10 h-11 sm:h-12 w-full bg-gray-50/80 border border-gray-200 rounded-lg focus:ring-blue-500 text-sm sm:text-base placeholder-gray-500" />
        </div>

        <!-- Email -->
        <div class="relative">
          <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
          <input type="email" placeholder="Enter Your Email" name="email"
            class="pl-10 h-11 sm:h-12 w-full bg-gray-50/80 border border-gray-200 rounded-lg focus:ring-blue-500 text-sm sm:text-base placeholder-gray-500" />
        </div>

        <!-- Phone -->
        <div class="relative">
          <i data-lucide="phone" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
          <input type="tel" placeholder="Enter Your Phone" name="phone"
            class="pl-10 h-11 sm:h-12 w-full bg-gray-50/80 border border-gray-200 rounded-lg focus:ring-blue-500 text-sm sm:text-base placeholder-gray-500" />
        </div>

        <!-- Password -->
        <div class="relative">
          <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
          <input type="password" placeholder="Create Password" name="password"
            class="pl-10 h-11 sm:h-12 w-full bg-gray-50/80 border border-gray-200 rounded-lg focus:ring-blue-500 text-sm sm:text-base placeholder-gray-500" />
        </div>

        <!-- Class -->
        <div class="relative">
          <i data-lucide="graduation-cap" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
          <input type="text" placeholder="Class (10-A)" name="student_class"
            class="pl-10 h-11 sm:h-12 w-full bg-gray-50/80 border border-gray-200 rounded-lg focus:ring-blue-500 text-sm sm:text-base placeholder-gray-500" />
        </div>

        <!-- Date of Birth -->
        <div class="relative">
          <i data-lucide="calendar" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
          <input type="date" name="dob"
            class="pl-10 h-11 sm:h-12 w-full bg-gray-50/80 border border-gray-200 rounded-lg focus:ring-blue-500 text-sm sm:text-base placeholder-gray-500" />
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="w-full h-11 sm:h-12 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm sm:text-base transition-colors">
          Sign UP
        </button>

        <!-- Divider -->
        <div class="flex items-center my-4 sm:my-6">
          <div class="flex-1 border-t border-gray-300"></div>
          <span class="px-3 text-gray-500 text-sm">or</span>
          <div class="flex-1 border-t border-gray-300"></div>
        </div>

        <!-- Google Button -->
        <button type="button"
          class="w-full h-11 sm:h-12 border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg text-sm sm:text-base flex items-center justify-center gap-2">
          <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Sign in with Google
        </button>

        <!-- Login Link -->
        <p class="text-center text-gray-600 mt-3 sm:mt-4 text-sm sm:text-base">
          Already have an account?
          <a href="{% url 'student_login' %}" class="text-blue-600 hover:underline font-medium">Login here</a>
        </p>

      </form>
    </div>
  </div>

  <!-- Activate Lucide Icons -->
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
