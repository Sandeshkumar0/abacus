<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" rel="stylesheet" />
  <style>
    html { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex bg-white">
  <div class="hidden lg:flex lg:w-1/2 flex-col bg-white min-h-screen">
    <div class="p-8">
      <a href="{% url 'portal-landing' %}">
        <img src="{% static 'portal/Logo.png' %}" alt="EMESYS Logo" class="absolute left-8 top-8 h-24" />
      </a>
    </div>
    <div class="flex-1 flex items-center justify-center">
      <img src="{% static 'portal/Students.jpg' %}" alt="Students Illustration" class="w-4/5 max-w-lg" />
    </div>
  </div>

  <div class="flex-1 lg:w-1/2 flex items-center justify-center p-8 relative overflow-hidden bg-cover bg-no-repeat bg-center"
    style="background-image: url('{% static 'portal/bg-wave.png' %}');">
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <div class="absolute top-0 right-0 w-96 h-96 rounded-full bg-white/10 -translate-y-32 translate-x-32"></div>
      <div class="absolute bottom-0 left-0 w-80 h-80 rounded-full bg-white/5 translate-y-32 -translate-x-32"></div>
      <div class="absolute top-1/2 right-1/4 w-64 h-64 rounded-full bg-white/5"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-xl border border-white/20 space-y-6">
        <div class="text-center">
          <h1 class="text-3xl font-bold text-blue-600 mb-2">Forgot your password?</h1>
          <p class="text-gray-600">Enter your account email and we will send a password reset link.</p>
        </div>

        {% if form.errors %}
          <div class="rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm p-3">
            {{ form.errors }}
          </div>
        {% endif %}

        <form method="post" class="space-y-4">
          {% csrf_token %}
          <div class="space-y-2">
            <label for="id_email" class="text-sm font-medium text-gray-700">Email</label>
            {{ form.email }}
          </div>
          <button type="submit"
            class="w-full h-12 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold rounded-xl shadow-lg transition-all duration-200">
            Send reset link
          </button>
        </form>

        <div class="text-sm text-center space-y-2">
          <p><a href="{% url 'student_login' %}" class="text-blue-600 hover:text-blue-700 hover:underline">Back to Student Login</a></p>
          <p><a href="{% url 'teacher_login' %}" class="text-blue-600 hover:text-blue-700 hover:underline">Back to Teacher Login</a></p>
        </div>
      </div>
    </div>
  </div>
  <script>
    const emailInput = document.getElementById('id_email');
    if (emailInput) {
      emailInput.className = 'h-12 w-full px-4 border border-gray-200 rounded-xl focus:outline-none focus:ring focus:ring-blue-200';
      emailInput.placeholder = 'Enter Email';
    }
  </script>
</body>
</html>
