<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMESYS – Teacher Sign Up</title>

  <!-- Tailwind utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter font (optional but matches shadcn/ui) -->
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" rel="stylesheet" />
  <style>
    html {
      font-family: 'Inter', sans-serif
    }
  </style>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen flex flex-col lg:flex-row">

  <!-- Left half: white background + illustration -->
  <div class="w-full lg:w-1/2 bg-white flex flex-col">
    <!-- Logo -->
    <header class="p-6 lg:p-8">
      <div class="flex items-center gap-3">
        <a href="{% url 'portal-landing' %}">
          <img src="{% static 'portal/Logo.png' %}" alt="EMESYS Logo"
            class="absolute left-8 top-8 h-24 cursor-pointer hover:opacity-80 transition-opacity">
        </a>
      </div>
    </header>

    <!-- Teacher illustration -->
    <div class="flex-1 flex items-center justify-center px-6 lg:px-8 pb-8">
      <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/57a9d9faa9af5cfc7074ed4f7bc4c3c058b9c040"
        alt="Teacher and student illustration" class="w-full h-auto max-w-md mx-auto" />
    </div>
  </div>

  <!-- Right half: gradient bg + form -->
  <div class="w-full lg:w-1/2 relative bg-cover bg-center bg-no-repeat flex items-center justify-center p-6 lg:p-8"
    style="background-image: url('{% static " portal/5883.jpg" %}')">

    <!-- Sign-up card -->
    <div class="relative z-10 w-full max-w-md">
      <div class="bg-white/80 backdrop-blur-sm rounded-3xl p-8 shadow-2xl border border-white/20">

        <!-- Heading -->
        <div class="text-center mb-8">
          <h1 class="text-3xl lg:text-4xl font-bold text-blue-700">Teacher Sign Up</h1>
          <p class="text-sm text-gray-600">Hey, enter your details to create an account.</p>
        </div>

        <!-- Form -->
        <form id="signup-form" action="{% url 'teacher_signup' %}" method="POST" class="space-y-6">
          {% csrf_token %}

          <!-- Django Messages -->
          {% if messages %}
          <div class="space-y-2 mb-4">
            {% for message in messages %}
            <div
              class="p-4 rounded-xl {% if message.tags == 'error' %}bg-red-100 text-red-700 border border-red-300{% elif message.tags == 'success' %}bg-green-100 text-green-700 border border-green-300{% else %}bg-blue-100 text-blue-700 border border-blue-300{% endif %}">
              {{ message }}
            </div>
            {% endfor %}
          </div>
          {% endif %}

          <!-- Name -->
          <div class="relative">
            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400"></i>
            <input id="name" name="name" type="text" placeholder="Enter Your Name" class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 placeholder-gray-500 text-gray-800
                     focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <!-- Email -->
          <div class="relative">
            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400"></i>
            <input id="email" type="email" name="email" placeholder="Enter Your Email" class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 placeholder-gray-500 text-gray-800
                     focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <!-- Phone -->
          <div class="relative">
            <i data-lucide="phone" class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400"></i>
            <input id="phone" name="phone" type="tel" placeholder="Enter Your Phone" class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 placeholder-gray-500 text-gray-800
                     focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <!-- Password -->
          <div class="relative">
            <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400"></i>
            <input id="password" type="password" name="password" placeholder="Create Password" class="w-full pl-12 pr-12 py-4 bg-gray-50 rounded-xl border border-gray-200 placeholder-gray-500 text-gray-800
                     focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button type="button" id="toggle-pass"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"
              aria-label="Toggle password visibility">
              <i data-lucide="eye"></i>
            </button>
          </div>

          <!-- Aadhaar ID -->
          <div class="relative">
            <i data-lucide="id-card" class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400"></i>
            <input id="aadhaar" type="text" name="aadhaar" placeholder="Aadhaar ID" class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 placeholder-gray-500 text-gray-800
                     focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <!-- Sign-up button -->
          <button type="submit" class="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold rounded-xl
                   hover:from-blue-700 hover:to-blue-800 shadow-lg hover:shadow-xl transition-all">
            Sign Up
          </button>

          <!-- Divider -->
          <div class="flex items-center my-6">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="px-4 text-sm text-gray-500">or</span>
            <div class="flex-grow border-t border-gray-300"></div>
          </div>

          <!-- Google sign-in -->
          <button type="button" class="w-full py-4 bg-white border border-gray-300 rounded-xl text-gray-700 font-medium flex items-center justify-center gap-3
                   hover:bg-gray-50 shadow-sm hover:shadow-md transition">
            <!-- Google logo -->
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4" />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853" />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05" />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335" />
            </svg>
            Sign in with Google
          </button>

          <!-- Already have account -->
          <p class="text-center text-sm text-gray-600 mt-6">
            Already have an account?
            <a href="{% url 'teacher_login' %}"
              class="text-blue-600 hover:text-blue-700 font-medium underline">Login</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- Behaviour scripts -->
  <script>
    // Replace <i data-lucide="..."> with SVGs
    lucide.createIcons();

    // Show / hide password
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pass');
    let showPass = false;

    toggleBtn.addEventListener('click', () => {
      showPass = !showPass;
      passwordInput.type = showPass ? 'text' : 'password';
      toggleBtn.innerHTML = '';
      toggleBtn.insertAdjacentHTML('beforeend',
        `<i data-lucide="${showPass ? 'eye-off' : 'eye'}"></i>`);
      lucide.createIcons({ icons: ['eye', 'eye-off'] });
    });

    // Form will submit normally to Django backend
  </script>
</body>

</html>
