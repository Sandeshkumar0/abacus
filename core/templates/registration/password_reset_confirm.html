<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.bunny.net" />
  <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700&display=swap" rel="stylesheet" />
  <style>
    html { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex bg-white">
  <div class="hidden lg:flex lg:w-1/2 flex-col bg-white min-h-screen">
    <div class="p-8">
      <a href="{% url 'portal-landing' %}">
        <img src="{% static 'portal/Logo.png' %}" alt="EMESYS Logo" class="absolute left-8 top-8 h-24" />
      </a>
    </div>
    <div class="flex-1 flex items-center justify-center">
      <img src="{% static 'portal/Students.jpg' %}" alt="Students Illustration" class="w-4/5 max-w-lg" />
    </div>
  </div>

  <div class="flex-1 lg:w-1/2 flex items-center justify-center p-8 relative overflow-hidden bg-cover bg-no-repeat bg-center"
    style="background-image: url('{% static 'portal/bg-wave.png' %}');">
    <div class="w-full max-w-md relative z-10">
      <div class="bg-white/80 backdrop-blur-sm rounded-2xl p-8 shadow-xl border border-white/20 space-y-5">
        {% if validlink %}
          <div class="text-center">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">Set a new password</h1>
            <p class="text-gray-600">Enter your new password below.</p>
          </div>
          <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
              class="w-full h-12 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-semibold rounded-xl shadow-lg transition-all duration-200">
              Update password
            </button>
          </form>
        {% else %}
          <div class="text-center space-y-3">
            <h1 class="text-3xl font-bold text-red-600">Link expired or invalid</h1>
            <p class="text-gray-600">This password reset link is no longer valid.</p>
            <a href="{% url 'password_reset' %}" class="text-blue-600 hover:text-blue-700 hover:underline">Request a new reset link</a>
          </div>
        {% endif %}
      </div>
    </div>
  </div>

  <script>
    const newPass = document.getElementById('id_new_password1');
    const confirmPass = document.getElementById('id_new_password2');
    [newPass, confirmPass].forEach((el) => {
      if (!el) return;
      el.className = 'h-12 w-full px-4 border border-gray-200 rounded-xl focus:outline-none focus:ring focus:ring-blue-200';
    });
  </script>
</body>
</html>
