{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue-light: #E6F1FF;
      --blue-dark: rgba(0, 79, 159, 0.94);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: Karla, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      background: #f3f4f6
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 30px;
      box-shadow: 0 4px 4px rgba(0, 0, 0, .25);
      padding: 32px;
      text-align: center
    }

    .icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      display: block
    }

    h1 {
      margin: 0 0 12px;
      font-size: 40px;
      line-height: 1;
      font-weight: 700;
      color: #000;
      text-shadow: 0 2px 2px rgba(0, 0, 0, .25)
    }

    p {
      margin: 0 0 32px;
      font-size: 24px;
      font-weight: 700;
      color: #000
    }

    .actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap
    }

    button {
      height: 54px;
      min-width: 178px;
      padding: 0 20px;
      border-radius: 30px;
      border: 1px solid rgba(0, 0, 0, .41);
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .2s
    }

    .btn-logout {
      background: var(--blue-light);
      color: #000
    }

    .btn-logout:hover {
      background: #d6e8ff
    }

    .btn-cancel {
      background: var(--blue-dark);
      color: #fff
    }

    .btn-cancel:hover {
      background: rgba(0, 79, 159, 1)
    }

    @media (max-width:480px) {
      h1 {
        font-size: 32px
      }

      p {
        font-size: 18px
      }

      button {
        min-width: 150px;
        height: 48px;
        font-size: 20px
      }

      .card {
        padding: 24px
      }
    }
  </style>
  <title>Logout</title>
</head>

<body>
  <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="logout-title" aria-describedby="logout-desc">
    <div class="card">
      <img class="icon" src="{% static 'portal/logout.png' %}" alt="Logout icon" />
      <h1 id="logout-title">Logout</h1>
      <p id="logout-desc">Are you sure you want to logout?</p>
      <div class="actions">
        <form method="POST">
          {% csrf_token %}
          <button type="submit" class="btn-logout">Logout</button>
        </form>
        <a href="{% url 'teacher_dashboard' %}">
          <button type="button" class="btn-cancel">Cancel</button>
        </a>
      </div>
    </div>
  </div>
</body>

</html>
